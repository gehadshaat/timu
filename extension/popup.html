<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 16px; font: 14px ui-rounded, system-ui, sans-serif; background: #fbf7f0; color: #1f1b16; }
      h1 { margin: 0 0 12px; font-size: 18px; }
      label { display: block; margin: 8px 0 4px; font-weight: 700; font-size: 12px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d4d4d8; border-radius: 8px; font: inherit; }
      button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 10px; background: #1f1b16; color: #fbf7f0; font: inherit; font-weight: 700; cursor: pointer; }
      button.secondary { background: #fff; color: #1f1b16; border: 1px solid #d4d4d8; }
      #status { margin-top: 10px; font-size: 12px; color: #52525b; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>🐝 Timu</h1>
    <label for="url">Timu URL</label>
    <input id="url" placeholder="http://localhost:3100" />
    <label for="token">Ingest token (TIMU_INGEST_TOKEN)</label>
    <input id="token" type="password" />
    <button id="save" class="secondary">Save</button>
    <button id="sync">Sync claude.ai chats now</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
